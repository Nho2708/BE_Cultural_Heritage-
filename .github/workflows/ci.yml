name: CI

on:
  # Nhánh việc chỉ chạy CI qua Pull Request (mở ở dạng nháp nếu chưa xong): chạy thêm lượt push cho cùng commit thì
  # hai lượt cùng tên kiểm tra, một lượt hỏng ngẫu nhiên cũng chặn gộp.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Đẩy commit mới lên cùng nhánh thì hủy lượt chạy cũ.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DSVHVN.sln

      - name: Build
        run: dotnet build DSVHVN.sln -c Release --no-restore

      # LocalDB của máy ảo khởi động chậm ở lần kết nối đầu: khởi động sẵn để các kiểm thử trên CSDL thật không hết thời gian chờ.
      - name: Start SQL Server LocalDB
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Test
        run: >-
          dotnet test DSVHVN.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults --logger trx

      # Chỉ báo số, không chặn. Bỏ qua mã migration sinh tự động khi tính tỷ lệ.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if ls TestResults/*/coverage.cobertura.xml > /dev/null 2>&1; then
            dotnet tool restore
            dotnet reportgenerator \
              "-reports:TestResults/*/coverage.cobertura.xml" \
              "-targetdir:TestResults/coverage-report" \
              "-reporttypes:MarkdownSummaryGithub" \
              "-classfilters:-DSVHVN.Infrastructure.Persistence.Migrations.*"
            {
              echo "## Độ phủ test"
              cat TestResults/coverage-report/SummaryGithub.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Không có tệp coverage để tóm tắt."
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: "Y"
          # Mật khẩu dùng một lần cho container tạm của lượt chạy này, không phải bí mật.
          MSSQL_SA_PASSWORD: Ci_Only_Pa55word!
        ports:
          - 1433:1433
        # Ảnh có thể chứa sqlcmd ở tools18 (cần -C) hoặc tools: thử lần lượt.
        options: >-
          --health-cmd "for s in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do if [ -x $s ]; then c=; case $s in *tools18*) c=-C;; esac; $s $c -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' && exit 0; fi; done; exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      ConnectionStrings__Default: Server=localhost,1433;Database=dsvhvn_ci;User Id=sa;Password=Ci_Only_Pa55word!;TrustServerCertificate=True;Encrypt=True
      EF_ARGS: --project src/DSVHVN.Infrastructure --startup-project src/DSVHVN.Api --configuration Release --no-build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore and build
        run: |
          dotnet tool restore
          dotnet restore src/DSVHVN.Api/DSVHVN.Api.csproj
          dotnet build src/DSVHVN.Api/DSVHVN.Api.csproj -c Release --no-restore

      - name: Apply every migration to an empty database
        run: dotnet ef database update $EF_ARGS

      # Lỗi nếu sửa entity mà quên tạo migration.
      - name: Check the model has no pending changes
        run: dotnet ef migrations has-pending-model-changes $EF_ARGS

      - name: Generate idempotent script
        run: |
          mkdir -p artifacts
          dotnet ef migrations script --idempotent -o artifacts/migrations.sql $EF_ARGS

      - uses: actions/upload-artifact@v7
        with:
          name: migrations-sql
          path: artifacts/migrations.sql
          retention-days: 14

  bao-mat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DSVHVN.sln

      - name: Fail on High or Critical vulnerable packages
        run: |
          dotnet list DSVHVN.sln package --vulnerable --include-transitive --format json > vulnerable.json
          python3 - <<'PY'
          import json, sys

          data = json.load(open("vulnerable.json", encoding="utf-8"))
          loi_nuget = [p.get("text", "") for p in data.get("problems", []) if p.get("level") == "error"]
          if loi_nuget:
              print("Không đọc được nguồn lỗ hổng NuGet:")
              for dong in loi_nuget:
                  print("  " + dong)
              sys.exit(1)

          gap = []
          dem = {}
          for du_an in data.get("projects", []):
              for khung in du_an.get("frameworks", []):
                  for nhom in ("topLevelPackages", "transitivePackages"):
                      for goi in khung.get(nhom, []):
                          for lh in goi.get("vulnerabilities", []):
                              muc = lh.get("severity", "Unknown")
                              dem[muc] = dem.get(muc, 0) + 1
                              dong = "{} | {} {} | {} | {}".format(
                                  du_an["path"].replace("\\", "/").split("/")[-1],
                                  goi["id"], goi.get("resolvedVersion", "?"), muc, lh.get("advisoryurl", ""))
                              print(dong)
                              if muc in ("High", "Critical"):
                                  gap.append(dong)

          print("Tổng theo mức: " + (json.dumps(dem, sort_keys=True) if dem else "không có gói nào có lỗ hổng"))
          if gap:
              print("Có {} lỗ hổng mức High hoặc Critical.".format(len(gap)))
              sys.exit(1)
          PY

  ky-hieu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scan internal working codes
        run: python .github/scripts/kiem-ky-hieu.py --base "$BASE_REF"

  # Dựng ảnh Docker của API và chạy thử đúng các script của máy chủ Google Cloud (deploy/google-cloud/may-chu) trên máy ảo của
  # GitHub: cài thư mục, nạp cấu hình, tạo CSDL trống, triển khai (sao lưu, migration, kiểm sức khỏe), sao lưu hằng đêm,
  # khôi phục từ bản sao lưu. Ảnh dựng tại chỗ (DSVHVN_KHONG_KEO_ANH=1), không cần Google Cloud.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check server scripts and Caddyfile
        run: |
          set -euo pipefail
          for f in deploy/google-cloud/may-chu/*.sh deploy/google-cloud/may-chu/bin/*.sh; do bash -n "$f"; done
          shellcheck -x -S warning deploy/google-cloud/may-chu/*.sh deploy/google-cloud/may-chu/bin/*.sh
          anh_caddy=$(sed -n 's/^ *image: \(caddy:.*\)$/\1/p' deploy/google-cloud/may-chu/compose.yml)
          # Mỗi bộ: học tập|quản trị|IP|địa chỉ phụ học tập|địa chỉ phụ quản trị (địa chỉ phụ cách nhau bằng dấu cách).
          for bo in '203.0.113.7|203.0.113.7:8443|203.0.113.7||' \
                    'vietnamheritage.vn|quantri.vietnamheritage.vn|203.0.113.7||' \
                    'vietnamheritage.vn|quantri.vietnamheritage.vn|203.0.113.7|www.vietnamheritage.vn 203.0.113.7|203.0.113.7:8443'; do
            IFS='|' read -r hoc_tap quan_tri ip phu_hoc_tap phu_quan_tri <<< "$bo"
            docker run --rm -v "$PWD/deploy/google-cloud/may-chu:/etc/caddy:ro" \
              -e DIA_CHI_HOC_TAP="$hoc_tap" -e DIA_CHI_QUAN_TRI="$quan_tri" -e DIA_CHI_IP="$ip" \
              -e DIA_CHI_HOC_TAP_PHU="$phu_hoc_tap" -e DIA_CHI_QUAN_TRI_PHU="$phu_quan_tri" \
              "$anh_caddy" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dsvhvn-ci/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Set up a simulated server
        run: |
          set -euo pipefail
          goc="$RUNNER_TEMP/dsvhvn"
          echo "DSVHVN_GOC=$goc" >> "$GITHUB_ENV"
          sudo env DSVHVN_GOC="$goc" bash deploy/google-cloud/may-chu/cai-dat-may-chu.sh --bo-qua-he-thong \
            --registry dsvhvn-ci --dia-chi-hoc-tap localhost --dia-chi-quan-tri localhost:8443

          # Cấu hình dùng một lần cho lượt chạy này, không phải bí mật.
          cau_hinh="$RUNNER_TEMP/cau-hinh"
          mkdir -p "$cau_hinh"
          mk_app="Ci$(openssl rand -hex 12)Ap1"
          printf 'MSSQL_SA_PASSWORD=Ci%sSa1\nMAT_KHAU_CSDL_UNG_DUNG=%s\n' "$(openssl rand -hex 12)" "$mk_app" > "$cau_hinh/bi-mat.env"
          printf 'AI_INTERNAL_KEY=ci\nAI_PROVIDER=gemini\n' > "$cau_hinh/ai.env"
          jq -n \
            --arg cs "Server=sql,1433;Database=dsvhvn;User Id=dsvhvn_app;Password=$mk_app;TrustServerCertificate=True;Encrypt=True" \
            --arg jwt "$(openssl rand -base64 64 | tr -d '\n')" \
            '{ConnectionStrings: {Default: $cs}, Database: {InitMode: "None"}, Jwt: {SigningKey: $jwt},
              Email: {Mode: "Log"}, Ai: {Mode: "Simulated"},
              Storage: {Provider: "Local", Local: {RootPath: "/data/storage"}},
              App: {FrontendBaseUrl: "https://localhost:8443", LearningWebBaseUrl: "https://localhost"},
              Cors: {AllowedOrigins: ["https://localhost:8443", "https://localhost"]}}' > "$cau_hinh/appsettings.Production.json"
          sudo env DSVHVN_GOC="$goc" "$goc/bin/nap-cau-hinh.sh" "$cau_hinh"

      - name: Create an empty database and deploy the API
        run: |
          set -euo pipefail
          sudo env DSVHVN_GOC="$DSVHVN_GOC" "$DSVHVN_GOC/bin/khoi-phuc-csdl.sh" --tao-trong
          sudo env DSVHVN_GOC="$DSVHVN_GOC" DSVHVN_KHONG_KEO_ANH=1 DSVHVN_BO_QUA_EDGE=1 "$DSVHVN_GOC/bin/trien-khai.sh" api ci
          curl -fsS http://127.0.0.1:8080/health; echo
          # Đọc qua đăng nhập dsvhvn_app (chỉ đọc và ghi dữ liệu) và qua tiêu đề chuyển tiếp như sau Caddy.
          curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-For: 203.0.113.7' \
            'http://127.0.0.1:8080/api/v1/public/provinces' | head -c 300; echo

      - name: Back up, redeploy and restore
        run: |
          set -euo pipefail
          sudo env DSVHVN_GOC="$DSVHVN_GOC" "$DSVHVN_GOC/bin/sao-luu-csdl.sh" hang-dem
          sudo env DSVHVN_GOC="$DSVHVN_GOC" DSVHVN_KHONG_KEO_ANH=1 DSVHVN_BO_QUA_EDGE=1 "$DSVHVN_GOC/bin/trien-khai.sh" api ci
          bak=$(sudo find "$DSVHVN_GOC/sao-luu/hang-dem" -name '*.bak' | sort | tail -n 1)
          sudo env DSVHVN_GOC="$DSVHVN_GOC" "$DSVHVN_GOC/bin/khoi-phuc-csdl.sh" --ghi-de "$bak"
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/health && break; sleep 2; done
          curl -fsS 'http://127.0.0.1:8080/api/v1/public/provinces' | head -c 300; echo
          sudo find "$DSVHVN_GOC/sao-luu" -name '*.bak' -printf '%p %s\n'

      - name: Server logs on failure
        if: failure()
        run: sudo docker compose --project-directory "$DSVHVN_GOC" -f "$DSVHVN_GOC/compose.yml" logs --no-color --tail 200
