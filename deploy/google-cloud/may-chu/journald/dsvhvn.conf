# Thời hạn giữ nhật ký trên máy chủ DiViet; cap-nhat-ha-tang.sh chép vào /etc/systemd/journald.conf.d/ rồi khởi động lại journald.
# Nhật ký của các dịch vụ Docker (compose.yml) và của hệ thống đều nằm trong journald: mỗi ngày một tệp, tệp chỉ còn dòng
# cũ hơn 30 ngày thì bị xóa, đúng thời hạn ghi trên trang Chính sách quyền riêng tư.
# Không chuyển sang rsyslog, vì /var/log/syslog của Ubuntu giữ khoảng 5 tuần theo logrotate.
[Journal]
Storage=persistent
MaxFileSec=1day
MaxRetentionSec=30day
SystemMaxUse=2G
ForwardToSyslog=no
